spring.application.name=blog-user-services
spring.main.sources=com.blog.services

# ========== 数据源配置（Druid） ==========
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/blog_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# ========== MyBatis Plus 配置 ==========
# 下划线表名 ↔ 驼峰字段自动映射
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 主键自增策略
mybatis-plus.global-config.db-config.id-type=auto

# ========== SQL 脚本初始化 ==========
# 启动时自动执行 classpath:schema.sql（幂等建表，不删数据）
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
